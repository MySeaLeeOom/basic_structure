services:
  frontend:
    build:
      context: ./requirements/frontend
      dockerfile: Dockerfile.dev
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}" # <--- The Linux Fix (Safe on Mac too)
    container_name: frontend_dev
    volumes:
      - ./requirements/frontend:/app:z      # Mount for live updates (:z is for SELinux)
      - /app/node_modules                   # Protect container-specific libs
    networks:
      - transcendence                        # Connect to 'notes' and 'postgres' [cite: 21]
    # ports:
    #   - "3000:3000"
    environment:
      - NOTES_API_URL=http://notes:3003     # Internal SSR communication 
      - NODE_ENV=development
      - HOME=/tmp                           # Fix for Corepack/pnpm permission issues
  
  notes:
    build:
      context: ./requirements/notes
      dockerfile: Dockerfile
    image: notes
    container_name: notes
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    networks:
      - transcendence

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: always
    networks:
      - transcendence
    ports:
      - "0.0.0.0:8080:80"
      - "0.0.0.0:8081:81"
      - "0.0.0.0:8082:82"

  postgres:
    build: ./requirements/postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence

networks:
  transcendence:
    driver: bridge

volumes:
  postgres_data:


