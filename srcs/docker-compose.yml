services:
  frontend:
    build:
      context: ./requirements/frontend
      dockerfile: Dockerfile.dev
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}" # <--- The Linux Fix (Safe on Mac too)
    image: frontend
    container_name: frontend
    restart: always
    volumes:
      - ./requirements/frontend:/app:z      # Mount for live updates (:z is for SELinux)
      - /app/node_modules                   # Protect container-specific libs
    networks:
      - transcendence                        # Connect to 'notes' and 'postgres' [cite: 21]
    # ports:
    #   - "3000:3000"
    environment:
      - NOTES_ADDR=${NOTES_ADDR}     # Internal SSR communication 
      - NODE_ENV=development
      - HOME=/tmp                           # Fix for Corepack/pnpm permission issues
  
  notes:
    build:
      context: ./requirements/notes-rs
      dockerfile: Dockerfile
    image: notes
    container_name: notes
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    networks:
      - transcendence

  auth:
    build:
      context: ./requirements/auth
      dockerfile: Dockerfile.dev
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}" # <--- The Linux Fix (Safe on Mac too)
    image: auth
    container_name: auth
    volumes:
      - ./requirements/auth:/app:z
      - /app/node_modules
    restart: always
    networks:
      - transcendence
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD} # now in secrets
      POSTGRES_ADDR: ${POSTGRES_ADDR}
      HOME: /tmp                              #fix for permissions when running as user not root
    secrets:
      - auth_db_password #chosen by myceleum
      - github_client_secret # generated by github
      - session_secret_key # Shared secret for cookie encryption
      # - AUTH_DB_URL=postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@${POSTGRES}/${AUTH_DB_NAME} 

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: always
    networks:
      - transcendence
    ports:
      - "0.0.0.0:8080:80"
      - "0.0.0.0:8081:81"
      - "0.0.0.0:8082:82"
      - "0.0.0.0:8083:83"


  postgres:
    build: ./requirements/postgres
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    secrets:
      - auth_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence
    

  gateway:
    build:
      context: ./requirements/gateway
      dockerfile: Dockerfile
    image: gateway
    container_name: gateway
    restart: always
    networks:
      - transcendence
    environment:
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}




volumes:
  postgres_data:

secrets:
  auth_db_password:
    file: ./secrets/auth_db_password # This file contains your secret
  github_client_secret:
    file: ./secrets/github_client_secret #
  session_secret_key:  
    file: ./secrets/session_secret_key

networks:
  transcendence:
    driver: bridge
