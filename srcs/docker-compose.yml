services:

  frontend:
    build:
      context: ./requirements/frontend
      dockerfile: Dockerfile
    image: frontend
    container_name: frontend
    restart: always
    networks:
      - transcendence
    environment:
      - NOTES_ADDR=${NOTES_ADDR}  # Internal SSR communication
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${AUTH_PORT}
      - NODE_TLS_REJECT_UNAUTHORIZED=0  # Allow SSR with self-signed certificates
    depends_on:
      - auth
  
  notes:
    build:
      context: ./requirements/notes
      dockerfile: Dockerfile
    image: notes
    container_name: notes
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

  editor:
      build:
        context: ./requirements/editor
        dockerfile: Dockerfile
      image: editor
      container_name: editor
      restart: always
      environment:
        DB_HOST: postgres
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - transcendence

  auth:
    build:
      context: ./requirements/auth
      dockerfile: Dockerfile
    image: auth
    container_name: auth
    volumes:
      - ./secrets/auth_db_password:/run/secrets/auth_db_password:ro
      - ./secrets/github_client_secret:/run/secrets/github_client_secret:ro
      - ./secrets/session_secret_key:/run/secrets/session_secret_key:ro
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD} # now in secrets
      POSTGRES_ADDR: ${POSTGRES_ADDR}
      HOME: /tmp    
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      WEBSITE_URL: ${WEBSITE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    # secrets:
    #   - auth_db_password #chosen by myceleum
    #   - github_client_secret # generated by github
    #   - session_secret_key # Shared secret for cookie encryption
    #   # - AUTH_DB_URL=postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@${POSTGRES}/${AUTH_DB_NAME} 

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: always
    networks:
      - transcendence
    ports:
      - "8443:443"
    depends_on:
      - frontend
      - auth
      - notes
      - editor


  postgres:
    build: ./requirements/postgres
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    secrets:
      - auth_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - transcendence
    
  grafana:
    build: 
      context: ./requirements/grafana
      dockerfile: Dockerfile
    image: grafana
    container_name: grafana
    restart: always
    secrets:
    - grafana_admin_user
    - grafana_admin_password
    networks:
      - transcendence
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview.json
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SERVER_ROOT_URL=https://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
  prometheus:
    build:
      context: ./requirements/prometheus
      dockerfile: Dockerfile
    image: prometheus
    container_name: prometheus
    restart: always
    volumes:
      - ./requirements/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - transcendence
  nginx-exporter:
    build: ./requirements/nginx-exporter
    container_name: nginx-exporter
    restart: always
    command:
      - "--nginx.scrape-uri=http://nginx:8088/stub_status"
    depends_on:
      - nginx
    networks:
      - transcendence
  postgres-exporter:
    build: ./requirements/postgres-exporter
    container_name: postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

  # --- AI & RAG Infrastructure ---
  
  vector-db:
    build: ./requirements/vector-db
    image: vector-db
    container_name: vector-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vector_db
    volumes:
      - vector_data:/var/lib/postgresql/data
    networks:
      - transcendence

  ai-ingest:
    build: ./requirements/ai-ingest
    image: ai-ingest
    container_name: ai-ingest
    restart: always
    environment:
      VECTOR_DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@vector-db:5432/vector_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_EMBEDDING_MODEL: mxbai-embed-large
    depends_on:
      - vector-db
    networks:
      - transcendence

  ai-rag:
    build: ./requirements/ai-rag
    image: ai-rag
    container_name: ai-rag
    restart: always
    environment:
      VECTOR_DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@vector-db:5432/vector_db
      MAIN_DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      LLM_GATEWAY_URL: http://llm-gateway:8001/stream
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_EMBEDDING_MODEL: mxbai-embed-large
    depends_on:
      - vector-db
      - llm-gateway
    networks:
      - transcendence

  llm-gateway:
    build: ./requirements/llm-gateway
    image: llm-gateway
    container_name: llm-gateway
    restart: always
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      LLM_MODEL: llama3
      LLM_BASE_URL: ${LLM_BASE_URL}
    networks:
      - transcendence

volumes:
  postgres_data:
    name: mycelium_db
  vector_data:
    name: mycelium_vector


secrets:
  auth_db_password:
    file: ./secrets/auth_db_password # This file contains your secret
  github_client_secret:
    file: ./secrets/github_client_secret #
  session_secret_key:  
    file: ./secrets/session_secret_key
  grafana_admin_user:
    file: ./secrets/grafana_admin_user
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

networks:
  transcendence:
    driver: bridge
