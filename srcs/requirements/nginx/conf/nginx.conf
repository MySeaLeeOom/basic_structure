server {
    listen 80;

    resolver 127.0.0.11 valid=10s;

    # location /api/auth {
    #     proxy_pass http://auth:3001;
    # }

    # API routes (specific)
    location /api/notes {
        proxy_pass http://notes:3003;
        proxy_set_header Host $host;
    }

	location /ws/ {
        proxy_pass http://editor:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
		# nginx has a standard 60s second timer,
		# that kills the connection if no bytes are being send/recieved
		# -> up the timer
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend catch-all
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}