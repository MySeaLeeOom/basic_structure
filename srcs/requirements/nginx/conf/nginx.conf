# Rate Limiting: 10 requests per second with a burst of 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;

    resolver 127.0.0.11 valid=10s;

    limit_req zone=api_limit burst=20 nodelay;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none';" always;

    # API routes (specific)
    location /api/notes {
        set $notes_upstream notes:3003;

        # THE BOUNCER: Stop the request and ask the Auth service
        auth_request /api/auth/verify;
        error_page 401 = @login;

        # THE EXTRACTION: Catch the "X-User-Id" header from the Auth Service's response
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;

        # THE INJECTOR: Overwrite or set the headers for the Backend Service
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;

        proxy_pass http://$notes_upstream;
    }

    location @login {
        return 302 /login;
    }

    location /api/auth {
        set $auth_upstream auth:3000;

        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass http://$auth_upstream;

        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
    }

    location /ws/ {
        set $editor_upstream editor:3004;

        # SECURE THE WEBSOCKET HANDSHAKE
        auth_request /api/auth/verify;
        error_page 401 = @login;

        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        proxy_pass http://$editor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend server
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}



