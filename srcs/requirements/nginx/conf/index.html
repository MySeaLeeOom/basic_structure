<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes Service Tester</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        pre { background: #eee; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Notes Service: Proof of Concept</h1>

    <div class="box">
        <h3>Create a New Poem</h3>
        <textarea id="noteContent" placeholder="Type your note here..."></textarea><br>
        <button onclick="saveNote()">Save to Database</button>
    </div>

    <div class="box">
        <h3>Current Notes</h3>
        <button onclick="fetchNotes()">Refresh List</button>
        <pre id="output">Results will appear here...</pre>
    </div>

    <script>
        // LOGIC: The POST request
        async function saveNote() {
            const content = document.getElementById('noteContent').value;
            try {
                const response = await fetch('/api/app/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: "Test Note", content: content })
                });
                const data = await response.json();
                alert("Saved! Check the console or refresh list.");
                console.log(data);
            } catch (err) {
                console.error("Save failed:", err);
            }
        }

        // LOGIC: The GET request
        async function fetchNotes() {
            const output = document.getElementById('output');
            try {
                const response = await fetch('/api/app/notes');
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = "Error fetching: " + err;
            }
        }
    </script>
</body>
</html>
